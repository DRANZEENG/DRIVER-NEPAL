
YAML

name: Build Driver Nepal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Extract Driver Nepal ZIP
        run: |
          mkdir -p extracted
          unzip -o driver_nepal_zero_budget_demo.zip -d extracted
          find extracted -name pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name pubspec.yaml -print -quit | xargs dirname)
          cd "$PROJECT"
          flutter pub get
          flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Nepal-APK
          path: extracted/**/build/app/outputs/flutter-apk/app-release.apk
